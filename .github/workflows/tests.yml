name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Install ProjectMapper and test dependencies
        run: python -m pip install -e ".[dev,mcp]"

      - name: Check Tk can create a window
        if: runner.os != 'Linux'
        run: python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update(); root.destroy()"

      - name: Check Tk can create a window (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update(); root.destroy()"

      - name: Run test suite
        if: runner.os != 'Linux'
        run: python -m pytest -ra

      - name: Run test suite (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest -ra
