[pytest]
testpaths = tests
pythonpath = src
norecursedirs = tmp* __pycache__ .git .venv vendor_exports
# Capture at the Python level. The default fd-level capture swaps the process's standard
# handles around every test, which on Windows intermittently makes Tcl fail to read its own
# library files while starting Tk (decision E4, plan section 17).
addopts = --capture=sys
