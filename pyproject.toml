[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "projectmapper"
dynamic = ["version"]
description = "Map a project folder, compile portable SQLite snapshots, and apply reviewed text patches."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = []
# Windows is the tested platform (decision E3); macOS/Linux are expected to work but untested,
# so no POSIX or X11 classifiers are claimed. Python versions listed are those the suite passes on.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
projectmapper = "projectmapper.app:main"

[project.urls]
Repository = "https://github.com/jacobmentalconstruct/_ProjectMAPPER"

[tool.setuptools.dynamic]
version = { attr = "projectmapper.core.config.APP_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["projectmapper*"]
